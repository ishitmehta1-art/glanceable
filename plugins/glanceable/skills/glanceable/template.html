<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glanceable answer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..600,100,0&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
<style>
/* Tokens: see DESIGN.md */
:root {
  color-scheme: light;
  --ground: #fffaf5;
  --surface: #ffffff;
  --raised: #ffffff;
  --tint: #fff3e8;         /* chips, passage panel, selected row */
  --ink: #2b2320;
  --muted: #6f625b;
  --faint: #cdbdb2;        /* non-text only */
  --rule: #f0e4da;
  --accent: #c4432b;       /* links, focus, the open action */
  --accent-ink: #ffffff;
  --marker: #ffd6a3;       /* quoted evidence only */
  --marker-ink: #2b2320;
  --ok: #2e7d50;
  --warn: #a95c00;
  --bad: #c83a26;
  --na: #8f8178;
  --shadow: 0 1px 2px rgba(110, 60, 30, .05), 0 12px 32px rgba(110, 60, 30, .08);
  --display: "Fraunces", "Iowan Old Style", "Georgia", serif;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --r-sm: 8px; --r-md: 12px; --r-lg: 20px; --r-full: 999px;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #1a1512; --surface: #221c18; --raised: #29221d; --tint: #2e2621;
    --ink: #f5ece4; --muted: #bcada3; --faint: #5e524b; --rule: #372d27;
    --accent: #ff8a6b; --accent-ink: #1a1512; --marker: #f5b97a; --marker-ink: #1a1512;
    --ok: #74d39f; --warn: #f2b35e; --bad: #ff8a7a; --na: #bcada3;
    --shadow: 0 12px 32px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #1a1512; --surface: #221c18; --raised: #29221d; --tint: #2e2621;
  --ink: #f5ece4; --muted: #bcada3; --faint: #5e524b; --rule: #372d27;
  --accent: #ff8a6b; --accent-ink: #1a1512; --marker: #f5b97a; --marker-ink: #1a1512;
  --ok: #74d39f; --warn: #f2b35e; --bad: #ff8a7a; --na: #bcada3;
  --shadow: 0 12px 32px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground); color: var(--ink);
  font: 400 15px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}
::selection { background: color-mix(in srgb, var(--marker) 70%, transparent); color: var(--ink); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.data { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.soft { font-family: var(--display); font-variation-settings: "SOFT" 100, "WONK" 0; }

.shell { max-width: 1200px; margin: 0 auto; padding-inline: var(--s4); padding-block: var(--s4) var(--s7); }
@media (min-width: 960px) { .shell { padding-inline: var(--s6); padding-block: var(--s5) 64px; } }

/* Top bar */
.topbar {
  display: flex; align-items: center; gap: var(--s3); min-height: 44px;
  margin-bottom: var(--s6); font-size: 13px; color: var(--muted);
}
.wordmark { font: 600 19px/1 var(--display); font-variation-settings: "SOFT" 100; color: var(--ink); letter-spacing: -.01em; }
.wordmark span { color: var(--accent); }
.topbar .mode { padding: 4px 10px; border-radius: var(--r-full); background: var(--tint); font-weight: 500; }
.topbar .spacer { flex: 1; }
.sources-btn {
  display: none; min-height: 44px; padding: 0 var(--s4); cursor: pointer;
  background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-full);
  font: 500 13px var(--sans); color: var(--ink);
}
.sources-btn .data { color: var(--muted); }

.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s5); }
@media (min-width: 960px) { .grid { grid-template-columns: minmax(0, 1fr) 420px; gap: 48px; } }
main { max-width: 760px; }

/* Question and answer */
.question { font: 500 15px/1.5 var(--sans); color: var(--muted); margin: 0 0 var(--s3); max-width: 65ch; text-wrap: balance; }
.answer {
  margin: 0; font: 600 clamp(28px, 3.6vw, 40px)/1.14 var(--display);
  font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 96; letter-spacing: -.02em;
  max-width: 26ch; text-wrap: balance;
}
.answer.is-long { font-size: clamp(24px, 2.8vw, 30px); line-height: 1.22; max-width: 34ch; }
.answer button {
  all: unset; cursor: pointer; border-radius: var(--r-sm);
  text-decoration: underline 2px transparent; text-underline-offset: .18em;
  transition: text-decoration-color 150ms var(--ease);
}
.answer button:hover { text-decoration-color: var(--marker); }
.answer button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.answer-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); margin-top: var(--s4); font-size: 13px; color: var(--muted); }
.answer-meta .conf { margin-right: var(--s2); }
.answer-meta b { font-weight: 600; color: var(--ink); }

/* Verification bar */
.check { margin-top: var(--s5); max-width: min(100%, 34rem); }
.bar { display: flex; gap: 3px; height: 8px; }
.bar span { display: block; height: 100%; border-radius: var(--r-full); }
.bar .supported { background: var(--ok); }
.bar .partial { background: var(--warn); }
.bar .unsupported { background: var(--bad); }
.bar .unverified { background: var(--faint); }
.tally { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); margin-top: var(--s2); font-size: 13px; color: var(--muted); }
.tally .data { font-size: 13px; color: var(--ink); font-weight: 500; }

/* Sections */
.section { margin-top: 40px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 var(--s3) var(--s2); }
.section-head h2 { font: 600 19px/1.2 var(--display); font-variation-settings: "SOFT" 100; margin: 0; }
.section-head .data { color: var(--muted); }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rows li {
  position: relative; border-radius: var(--r-md);
  padding: var(--s3);
  transition: background 150ms var(--ease);
}
.rows li + li::before {
  content: ""; position: absolute; top: -1px; left: var(--s3); right: var(--s3); height: 1px; background: var(--rule);
}
.rows li.is-link:hover { background: var(--tint); }
.rows li.is-link:hover::before, .rows li.is-link:hover + li::before,
.rows li.is-selected::before, .rows li.is-selected + li::before { opacity: 0; }
.rows li.is-selected { background: var(--tint); }
.claim-btn {
  all: unset; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--s3);
  width: 100%; cursor: pointer; border-radius: var(--r-sm);
}
.claim-btn::after { content: ""; position: absolute; inset: 0; border-radius: var(--r-md); }
.claim-btn:focus-visible { outline: none; }
.claim-btn:focus-visible::after { outline: 2px solid var(--accent); outline-offset: -2px; }
.claim-static { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--s3); }
.claim-text { font-size: 16px; line-height: 1.5; max-width: 68ch; }
.is-selected .claim-text > span {
  background: linear-gradient(to top, color-mix(in srgb, var(--marker) 55%, transparent) .38em, transparent .38em);
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.st-unsupported .claim-text { text-decoration: line-through 1px var(--muted); color: var(--muted); }
.row-meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2);
  margin: var(--s2) 0 0 36px; font-size: 12px;
}
.status-word { font: 600 12px/1 var(--sans); }
.st-supported .status-word { color: var(--ok); }
.st-partial .status-word { color: var(--warn); }
.st-unsupported .status-word { color: var(--bad); }
.st-unverified .status-word { color: var(--muted); }
.key {
  position: relative; z-index: 1; min-height: 28px; padding: 6px 10px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-full);
  font: 400 12px/1 var(--mono); color: var(--muted);
  transition: color 150ms var(--ease), border-color 150ms var(--ease);
}
.key::before { content: ""; position: absolute; inset: -8px; }
.key:hover { color: var(--accent); border-color: var(--accent); }

/* Status glyphs */
.glyph {
  width: 24px; height: 24px; border-radius: var(--r-full); margin-top: 0;
  display: grid; place-items: center; color: var(--st);
  background: color-mix(in srgb, var(--st) 14%, var(--surface));
}
.glyph svg { width: 14px; height: 14px; }
.st-supported { --st: var(--ok); }
.st-partial { --st: var(--warn); }
.st-unsupported { --st: var(--bad); }
.st-unverified { --st: var(--na); }
.st-step { --st: var(--accent); }

details.report { margin-top: var(--s7); padding: var(--s3); border-radius: var(--r-md); background: var(--tint); }
details.report summary { cursor: pointer; font: 500 13px var(--sans); color: var(--muted); min-height: 28px; }
details.report pre { white-space: pre-wrap; font: 400 14px/1.65 var(--sans); color: var(--muted); max-width: 72ch; }

/* Reading pane */
.pane {
  background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow);
  padding: var(--s5); align-self: start;
  scrollbar-width: thin; scrollbar-color: var(--rule) transparent;
}
@media (min-width: 960px) {
  .pane { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--s5)); max-height: calc(100vh - 48px); overflow: auto; }
}
.handle { display: none; width: 36px; height: 4px; border-radius: 2px; background: var(--rule); margin: 0 auto var(--s3); }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); }
.pane-head h2 { font: 500 13px/1.3 var(--sans); color: var(--muted); margin: 0; }
.pane-head h2:focus { outline: none; }
.close {
  display: none; min-height: 44px; min-width: 44px; padding: 0 var(--s4); cursor: pointer;
  background: var(--tint); border: 0; border-radius: var(--r-full); font: 500 13px var(--sans); color: var(--ink);
}
.src-title { font: 600 21px/1.25 var(--display); font-variation-settings: "SOFT" 100; margin: 0 0 var(--s1); text-wrap: balance; }
.src-site { color: var(--muted); margin: 0 0 var(--s5); overflow-wrap: anywhere; }
.pane .claim { font: 400 15px/1.5 var(--sans); color: var(--ink); margin: 0 0 var(--s4); }
.pane .claim span { color: var(--muted); }
.passage {
  margin: 0 0 var(--s4); padding: var(--s4) 18px; border-radius: var(--r-md); background: var(--tint);
  font: 400 16px/1.7 var(--sans); overflow-wrap: anywhere;
}
.passage mark {
  color: var(--marker-ink); padding: .08em .16em; border-radius: 6px;
  background: linear-gradient(var(--marker), var(--marker)) no-repeat 0 0 / 0% 100%;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  animation: sweep 360ms var(--ease) 80ms forwards;
}
@keyframes sweep { to { background-size: 100% 100%; } }
.passage .cut { color: var(--muted); }
.verdict { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--s2) var(--s3); align-items: start; margin: 0 0 var(--s5); }
.verdict p { margin: 2px 0 0; font-size: 13px; line-height: 1.5; color: var(--muted); }
.verdict b { font-weight: 600; color: var(--st); margin-right: var(--s1); }
.empty-quote { font-size: 14px; color: var(--muted); margin: 0 0 var(--s4); padding: var(--s4); border-radius: var(--r-md); background: var(--tint); }
.open {
  display: inline-flex; align-items: center; gap: var(--s2); min-height: 44px; padding: 0 20px;
  border-radius: var(--r-full); background: var(--accent); color: var(--accent-ink);
  font: 600 14px var(--sans); text-decoration: none;
  transition: background 150ms var(--ease), transform 150ms var(--ease);
}
.open:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); }
.open:active { transform: translateY(1px); }
.hint { font-size: 12px; color: var(--muted); margin: var(--s2) 0 0; }

.pane-intro { font-size: 13px; color: var(--muted); margin: 0 0 var(--s2); }
.srclist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.srcitem {
  all: unset; box-sizing: border-box; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: var(--s2);
  width: 100%; min-height: 44px; padding: var(--s3) var(--s2); cursor: pointer; border-radius: var(--r-md);
  transition: background 150ms var(--ease);
}
.srcitem:hover { background: var(--tint); }
.srcitem:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
.srcnum { color: var(--muted); line-height: 1.7; }
.srcname { display: block; font: 500 15px/1.35 var(--sans); }
.srcitem .data { color: var(--muted); }

.scrim { display: none; }

@media (max-width: 959px) {
  .sources-btn, .close, .handle { display: block; }
  .scrim {
    display: block; position: fixed; inset: 0; z-index: 19;
    background: color-mix(in srgb, var(--ink) 30%, transparent);
    opacity: 0; visibility: hidden; transition: opacity 240ms var(--ease), visibility 0s 240ms;
  }
  .scrim.is-open { opacity: 1; visibility: visible; transition-delay: 0s; }
  .pane {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 80vh; overflow: auto;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    padding: var(--s3) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%); visibility: hidden;
    transition: transform 240ms var(--ease), visibility 0s 240ms;
  }
  .pane.is-open { transform: none; visibility: visible; transition-delay: 0s; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
  .passage mark { animation: none; background-size: 100% 100%; }
}
</style>
</head>

<script>
(function () {
  "use strict";
  var main = document.getElementById("main");
  var pane = document.getElementById("pane");
  var scrim = document.getElementById("scrim");
  var status = document.getElementById("status");
  var sourcesBtn = document.getElementById("sources-btn");
  var data;
  try {
    data = JSON.parse(document.getElementById("glance-data").textContent);
  } catch (e) {
    main.textContent = "This view couldn't load its data (" + e.message + "). Ask the AI to regenerate it.";
    return;
  }
  var sources = data.sources || {};
  var order = Object.keys(sources);
  var STATUS = {
    supported:   { word: "Supported",        say: "The source says this." },
    partial:     { word: "Partly supported", say: "The source says something weaker or narrower." },
    unsupported: { word: "Not supported",    say: "The source doesn't say this." },
    unverified:  { word: "Couldn't check",   say: "The source couldn't be opened." }
  };
  var ICONS = {
    supported: "M3.5 8.5l3 3 6-7",
    partial: "M8 3.5v5.5 M8 12.2v.3",
    unsupported: "M4.5 4.5l7 7 M11.5 4.5l-7 7",

    step: "M3.5 8h9 M9 4.5l3.5 3.5-3.5 3.5"
  };
  var active = null;      // selected <li>
  var opener = null;      // element to return focus to
  var mobile = window.matchMedia("(max-width: 959px)");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function glyph(kind) {
    var wrap = el("span", "glyph");
    wrap.setAttribute("aria-hidden", "true");
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 16 16");
    var p = document.createElementNS(ns, "path");
    p.setAttribute("d", ICONS[kind]);
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", "currentColor");
    p.setAttribute("stroke-width", "2");
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round");
    svg.appendChild(p);
    wrap.appendChild(svg);
    return wrap;
  }
  // Remove markup that sometimes survives copying from source pages.
  function clean(s) {
    return String(s || "").replace(/<[^>]+>/g, "").replace(/\*\*|__|`/g, "").replace(/\s+/g, " ")
      .replace(/(…|\.\.\.)(\s*(…|\.\.\.))+/g, "…").trim();
  }
  function safeUrl(u) {
    try { var p = new URL(u); return (p.protocol === "https:" || p.protocol === "http:") ? p : null; }
    catch (e) { return null; }
  }
  function num(id) { return order.indexOf(id) + 1; }
  var CODE_HOSTS = { "github.com": 1, "gitlab.com": 1, "codeberg.org": 1 };
  function siteOf(src) {
    var u = safeUrl(src.url);
    var host = u ? u.hostname.replace(/^www\./, "") : "";
    // On code hosts the owner/repo says more than the domain does.
    if (u && CODE_HOSTS[host] && (!src.site || src.site === host)) {
      var parts = u.pathname.split("/").filter(Boolean);
      if (parts.length >= 2) return parts[0] + "/" + parts[1];

    return src.site || host || "source";
  }
  function validCites(item) {
    return (item.cites || []).filter(function (c) { return c && sources[c.source]; });
  }
  function uniqueBySource(cites) {
    var seen = {};
    return cites.filter(function (c) { if (seen[c.source]) return false; seen[c.source] = 1; return true; });
  }
  function keyButton(cite, onOpen) {
    var k = el("button", "key data", "[" + num(cite.source) + "] " + siteOf(sources[cite.source]));
    k.type = "button";

    return k;
  }

  // Top bar
  var mode = document.getElementById("mode");
  mode.textContent = data.mode === "verify" ? "Checked report" : "Researched answer";
  sourcesBtn.appendChild(document.createTextNode("Sources "));
  sourcesBtn.appendChild(el("span", "data", String(order.length)));
  sourcesBtn.addEventListener("click", function () { opener = sourcesBtn; showList(true); });

  // Question and answer
  if (data.question) main.appendChild(el("p", "question", data.question));
  var answer = data.answer || {};
  var answerText = answer.text || "No answer was given.";
  var answerCites = uniqueBySource(validCites(answer));
  var h1 = el("h1", "answer" + (answerText.length > 120 ? " is-long" : ""));
  if (answerCites.length) {
    var ab = el("button", null, answerText);
    ab.type = "button";
    ab.addEventListener("click", function () { opener = ab; openSource({ text: answerText }, answerCites[0], null); });
    h1.appendChild(ab);
  } else {
    h1.textContent = answerText;
  }
  main.appendChild(h1);

  var am = el("div", "answer-meta");
  if (answer.confidence) {
    var conf = el("span", "conf");
    conf.appendChild(document.createTextNode("Confidence: "));
    conf.appendChild(el("b", null, answer.confidence));
    am.appendChild(conf);
  }
  answerCites.forEach(function (c) {
    am.appendChild(keyButton(c, function (cite, k) { opener = k; openSource({ text: answerText }, cite, null); }));
  });
  if (am.childNodes.length) main.appendChild(am);

  // Verification bar
  var claims = [].concat(data.reasons || [], data.risks || [], data.corrections || []);
  var counts = { supported: 0, partial: 0, unsupported: 0, unverified: 0 };
  claims.forEach(function (c) { if (counts[c.status] != null) counts[c.status]++; });
  if (claims.length) {
    var check = el("div", "check");
    var bar = el("div", "bar");
    bar.setAttribute("role", "img");
    var parts = [];
    Object.keys(counts).forEach(function (k) {
      if (!counts[k]) return;
      var s = el("span", k);
      s.style.flex = String(counts[k]);
      bar.appendChild(s);
      parts.push(counts[k] + " " + STATUS[k].word.toLowerCase());
    });
    bar.setAttribute("aria-label", claims.length + " claims checked: " + parts.join(", "));
    check.appendChild(bar);
    var tally = el("div", "tally");
    Object.keys(counts).forEach(function (k) {
      if (!counts[k]) return;
      var t = el("span");
      t.appendChild(el("span", "data", String(counts[k])));
      t.appendChild(document.createTextNode(" " + STATUS[k].word.toLowerCase()));
      tally.appendChild(t);
    });
    check.appendChild(tally);
    main.appendChild(check);
  }

  // Sections
  function renderRow(item, isStep) {
    var cites = isStep ? [] : validCites(item);
    var st = isStep ? "step" : (STATUS[item.status] ? item.status : "unverified");
    var li = el("li", "st-" + st);
    var inner;
    if (cites.length) {
      li.classList.add("is-link");
      inner = el("button", "claim-btn");
      inner.type = "button";
      inner.addEventListener("click", function () { opener = inner; openSource(item, cites[0], li); });
    } else {
      inner = el("div", "claim-static");
    }
    inner.appendChild(glyph(st));
    var text = el("span", "claim-text");
    text.appendChild(el("span", null, item.text));
    inner.appendChild(text);
    if (!isStep) inner.appendChild(el("span", "sr-only", ". " + STATUS[st].word));
    li.appendChild(inner);
    if (!isStep) {
      var meta = el("div", "row-meta");
      meta.appendChild(el("span", "status-word", STATUS[st].word));
      uniqueBySource(cites).forEach(function (ct) {
        meta.appendChild(keyButton(ct, function (cite, k) { opener = k; openSource(item, cite, li); }));
      });
      li.appendChild(meta);
    }
    return li;
  }
  function renderSection(title, list, isStep) {
    if (!list || !list.length) return;
    var s = el("section", "section");
    var head = el("div", "section-head");
    head.appendChild(el("h2", null, title));
    head.appendChild(el("span", "data", String(list.length)));
    s.appendChild(head);
    var ul = el("ul", "rows");
    list.forEach(function (i) { ul.appendChild(renderRow(i, isStep)); });
    s.appendChild(ul);
    main.appendChild(s);
  }
  renderSection("Why", data.reasons);
  renderSection("Watch out", data.risks);
  renderSection("Didn't hold up", data.corrections);
  renderSection("Next step", data.next_steps, true);

  if (data.report) {
    var d = el("details", "report");
    d.appendChild(el("summary", null, "Original report"));
    d.appendChild(el("pre", null, data.report));
    main.appendChild(d);
  }

  // Passage: the quote plus one sentence either side, trimmed with an ellipsis.
  function passage(ctx, quote) {
    var bq = el("blockquote", "passage");
    var at = quote ? ctx.indexOf(quote) : -1;
    if (at < 0) { bq.textContent = ctx || quote; return bq; }
    var SPLIT = /(?<=[.!?])\s+/;
    var before = ctx.slice(0, at).split(SPLIT);
    var after = ctx.slice(at + quote.length).split(SPLIT);
    var keepBefore = before.slice(-2).join(" ");
    var keepAfter = after.slice(0, 2).join(" ");
    if (before.length > 2 && !/^\s*…/.test(keepBefore)) bq.appendChild(el("span", "cut", "… "));
    bq.appendChild(document.createTextNode(keepBefore + (keepBefore && !/\s$/.test(keepBefore) && /[.!?]$/.test(keepBefore) ? " " : "")));
    bq.appendChild(el("mark", null, quote));
    bq.appendChild(document.createTextNode(keepAfter && !/^[\s,;:.)]/.test(keepAfter) ? " " + keepAfter : keepAfter));
    if (after.length > 2 && !/…\s*$/.test(keepAfter)) bq.appendChild(el("span", "cut", " …"));
    return bq;
  }

  // Reading pane
  function head(text, withClose) {
    pane.replaceChildren();
    pane.appendChild(el("div", "handle"));
    var h = el("div", "pane-head");
    var h2 = el("h2", null, text);
    h2.tabIndex = -1;
    h.appendChild(h2);
    if (withClose) {
      var x = el("button", "close", "Close");
      x.type = "button";
      x.addEventListener("click", closeSheet);
      h.appendChild(x);
    }
    pane.appendChild(h);
    return h2;
  }
  function select(li) {
    if (active) active.classList.remove("is-selected");
    active = li;
    if (li) li.classList.add("is-selected");
  }
  function firstUse(id) {
    var all = [{ text: answerText, cites: answer.cites }].concat(claims);
    for (var i = 0; i < all.length; i++) {
      var cs = all[i].cites || [];
      for (var j = 0; j < cs.length; j++) if (cs[j] && cs[j].source === id) return { item: all[i], cite: cs[j] };
    }
    return null;
  }
  function openSheet(focusEl) {
    if (!mobile.matches) return;
    pane.classList.add("is-open");
    scrim.classList.add("is-open");
    sourcesBtn.setAttribute("aria-expanded", "true");
    if (focusEl) focusEl.focus({ preventScroll: true });
  }
  function closeSheet() {
    var wasOpen = pane.classList.contains("is-open");
    pane.classList.remove("is-open");
    scrim.classList.remove("is-open");
    sourcesBtn.setAttribute("aria-expanded", "false");
    select(null);
    if (!mobile.matches || wasOpen) showList(false);
    if (wasOpen && opener) opener.focus({ preventScroll: true });
  }
  function showList(open) {
    var h2 = head("Sources", true);
    pane.appendChild(el("p", "pane-intro", "Select any line to read the exact passage it came from."));
    var ul = el("ol", "srclist");
    order.forEach(function (id) {
      var src = sources[id];
      var li = el("li");
      var b = el("button", "srcitem");
      b.type = "button";
      b.appendChild(el("span", "srcnum data", String(num(id)).padStart(2, "0")));
      var txt = el("span");
      txt.appendChild(el("span", "srcname", src.title || "Untitled source"));
      txt.appendChild(el("span", "data", siteOf(src)));
      b.appendChild(txt);
      b.addEventListener("click", function () {
        var use = firstUse(id);
        if (use) openSource(use.item, use.cite, null);
      });
      li.appendChild(b);
      ul.appendChild(li);
    });
    pane.appendChild(ul);
    if (open) openSheet(h2);
  }
  function openSource(item, cite, li) {
    select(li);
    var src = sources[cite.source] || {};
    var st = STATUS[item.status] ? item.status : null;
    var label = "Source " + num(cite.source) + " of " + order.length;
    var h2 = head(label, true);

    pane.appendChild(el("h3", "src-title", src.title || "Untitled source"));
    pane.appendChild(el("p", "src-site data", siteOf(src)));

    var cl = el("p", "claim");
    cl.appendChild(el("span", null, "Claim: "));
    cl.appendChild(document.createTextNode(item.text || ""));
    pane.appendChild(cl);

    var ctx = clean(src.context);
    var quote = clean(cite.quote);
    if (ctx || quote) pane.appendChild(passage(ctx, quote));
    else pane.appendChild(el("p", "empty-quote", "No passage was captured from this source."));

    if (st) {
      var v = el("div", "verdict st-" + st);
      v.appendChild(glyph(st));
      var vp = el("p");
      vp.appendChild(el("b", null, STATUS[st].word));
      vp.appendChild(document.createTextNode(item.note || STATUS[st].say));
      v.appendChild(vp);
      pane.appendChild(v);
    }

    var u = safeUrl(src.url);
    if (u) {
      var href = u.href.split("#")[0];
      if (quote) href += "#:~:text=" + encodeURIComponent(quote.slice(0, 300));
      var a = el("a", "open", "Open at this passage ↗");
      a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
      pane.appendChild(a);
      if (quote) pane.appendChild(el("p", "hint", "Jumps to the highlighted sentence in Chrome and Edge."));
    }
    status.textContent = "Showing " + label.toLowerCase() + ", " + (src.title || "untitled");
    pane.scrollTop = 0;
    openSheet(h2);
  }
  scrim.addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
  showList(false);
})();
</script>
</body>
</html>
