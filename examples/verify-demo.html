* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ground); color: var(--ink);
  font: 15px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.shell { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
@media (min-width: 960px) { .shell { padding-inline: 28px; padding-block: 28px 64px; } }

/* Top bar */
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  font: 500 12px/1 var(--mono); color: var(--muted);
  padding-bottom: 16px; margin-bottom: 24px; border-bottom: 1px solid var(--rule);
}
.wordmark { color: var(--ink); letter-spacing: .02em; display: inline-flex; align-items: center; gap: 8px; }
.wordmark i {
  width: 10px; height: 10px; border-radius: 2px; background: var(--marker);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 25%, transparent);
}
.topbar .sep { color: var(--faint); }

.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@media (min-width: 960px) { .grid { grid-template-columns: minmax(0, 1fr) 420px; gap: 40px; } }

/* Answer column */
.label {
  font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 10px;
}
.question { font-size: 16px; color: var(--muted); margin: 0 0 24px; max-width: 62ch; text-wrap: balance; }
.answer {
  display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; cursor: default;
  font: 500 clamp(26px, 3.6vw, 36px)/1.18 var(--serif); letter-spacing: -.01em;
  font-variation-settings: "opsz" 60; color: var(--ink); max-width: 30ch; text-wrap: balance; margin: 0;
}
button.answer { cursor: pointer; transition: color .12s ease; }
button.answer:hover { color: var(--accent); }

/* Verification bar */
.check { margin-top: 28px; max-width: 560px; }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--na-tint); gap: 2px; }
.bar span { display: block; height: 100%; }
.bar .supported { background: var(--ok); }
.bar .partial { background: var(--warn); }
.bar .unsupported { background: var(--bad); }
.bar .unverified { background: var(--na); opacity: .5; }
.tally { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.tally b { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.tally .conf { margin-left: auto; }
@media (max-width: 520px) { .tally .conf { margin-left: 0; } }

/* Sections */
.section { margin-top: 40px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
.section-head h2 { font: 600 13px/1 var(--sans); letter-spacing: .02em; margin: 0; }
.section-head span { font: 400 12px var(--mono); color: var(--faint); }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { border-bottom: 1px solid var(--rule); }
.row {
  display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; width: 100%;
  padding: 14px 10px 14px 4px; text-align: left; background: none; border: 0; border-radius: 0; cursor: pointer;
  transition: background .12s ease;
}
.row:hover { background: var(--hover); }
.row[aria-pressed="true"] { background: var(--accent-tint); }
div.row { cursor: default; }
div.row:hover { background: none; }
.glyph {
  width: 22px; height: 22px; border-radius: 50%; margin-top: 1px;
  display: grid; place-items: center; font: 600 12px/1 var(--mono);
}
.st-supported .glyph { background: var(--ok-tint); color: var(--ok); }
.st-partial .glyph { background: var(--warn-tint); color: var(--warn); }
.st-unsupported .glyph { background: var(--bad-tint); color: var(--bad); }
.st-unverified .glyph { background: var(--na-tint); color: var(--na); }
.st-step .glyph { background: var(--ink); color: var(--surface); }
.claim-text { display: block; font-size: 16px; line-height: 1.5; max-width: 68ch; }
.st-unsupported .claim-text { text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: 1.5px; color: var(--muted); }
.row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 7px; }
.status-word { font: 500 11px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; }
.st-supported .status-word { color: var(--ok); }
.st-partial .status-word { color: var(--warn); }
.st-unsupported .status-word { color: var(--bad); }
.st-unverified .status-word { color: var(--na); }
.key {

  border: 1px solid var(--rule); border-radius: 4px; padding: 3px 6px; cursor: pointer;
}
.key:hover { color: var(--accent); border-color: var(--accent); }

details.report { margin-top: 40px; border-top: 1px solid var(--rule); padding-top: 14px; }
details.report summary { cursor: pointer; font: 500 13px var(--sans); color: var(--muted); }
details.report pre { white-space: pre-wrap; font: 14px/1.65 var(--serif); color: var(--muted); max-width: 72ch; }

@media (min-width: 960px) { .pane { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); max-height: calc(100vh - 40px); overflow: auto; } }

.verdict.st-partial { background: var(--warn-tint); }
.verdict.st-unsupported { background: var(--bad-tint); }
.verdict.st-unverified { background: var(--na-tint); }
.verdict strong { display: block; font-weight: 600; }
.pane .claim { font-size: 14px; color: var(--muted); margin: 0 0 16px; }
.pane .claim b { color: var(--ink); font-weight: 500; }
.passage {
  margin: 0 0 20px; font: 400 18px/1.62 var(--serif); font-variation-settings: "opsz" 18;
  overflow-wrap: anywhere;
}
.passage::before { content: "\201C"; }
.passage::after { content: "\201D"; }
.passage mark {
  color: var(--marker-ink); background: var(--marker); padding: .04em .14em;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  border-radius: .18em .4em .22em .35em;
}
.pane .empty-quote { font-size: 14px; color: var(--muted); font-style: italic; margin: 0 0 20px; }
.open {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  font: 500 14px var(--sans); color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 6px; padding: 8px 12px;
}
.open:hover { background: var(--accent-tint); }
.hint { font-size: 12px; color: var(--faint); margin: 10px 0 0; }

.srclist { list-style: none; margin: 0; padding: 0; }
.srclist li { border-top: 1px solid var(--rule); }
.srclist li:first-child { border-top: 0; }
.srcitem {
  display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; width: 100%;
  padding: 12px 4px; text-align: left; background: none; border: 0; cursor: pointer;
}
.srcitem:hover .srcname { color: var(--accent); }
.srcnum { font: 500 12px/1.6 var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.srcname { font: 500 15px/1.35 var(--serif); display: block; }
.srcdom { font: 400 12px var(--mono); color: var(--muted); }
.pane-intro { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

@media (max-width: 959px) {
  .pane {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-height: 78vh; overflow: auto;
    border-radius: 14px 14px 0 0; border-bottom: 0;
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -8px 30px rgba(0,0,0,.18);
    transform: translateY(105%); transition: transform .22s ease;
  }
  .pane.is-open { transform: none; }
  .close { display: block; }
}
@media (prefers-reduced-motion: reduce) { .pane, .row, button.answer { transition: none; } }

  if (answerCites.length) {
    ans.type = "button";
    ans.addEventListener("click", function () { openSource({ text: answer.text }, answerCites[0], null); });
  }
  main.appendChild(ans);

  // Verification bar
  var claims = [].concat(data.reasons || [], data.risks || [], data.corrections || []);
  var counts = { supported: 0, partial: 0, unsupported: 0, unverified: 0 };
  claims.forEach(function (c) { if (counts[c.status] != null) counts[c.status]++; });
  if (claims.length) {
    var check = el("div", "check");
    var bar = el("div", "bar");
    bar.setAttribute("role", "img");
    var parts = [];
    Object.keys(counts).forEach(function (k) {
      if (!counts[k]) return;
      var s = el("span", k);
      s.style.flex = String(counts[k]);
      bar.appendChild(s);
      parts.push(counts[k] + " " + STATUS[k].word.toLowerCase());
    });
    bar.setAttribute("aria-label", "Claims checked: " + parts.join(", "));
    check.appendChild(bar);
    var tally = el("div", "tally");
    Object.keys(counts).forEach(function (k) {
      if (!counts[k]) return;
      var t = el("span");
      t.appendChild(el("b", null, String(counts[k])));
      t.appendChild(document.createTextNode(" " + STATUS[k].word.toLowerCase()));
      tally.appendChild(t);
    });
    if (answer.confidence) {
      var c = el("span", "conf");
      c.appendChild(document.createTextNode("Confidence "));
      c.appendChild(el("b", null, answer.confidence));
      tally.appendChild(c);
    }
    check.appendChild(tally);
    main.appendChild(check);
  }

  // Sections
  function renderRow(item, isStep) {
    var li = el("li");
    var cites = isStep ? [] : validCites(item);
    var st = isStep ? "step" : (STATUS[item.status] ? item.status : "unverified");
    var row = el(cites.length ? "button" : "div", "row st-" + st);
    if (cites.length) {
      row.type = "button";
      row.setAttribute("aria-pressed", "false");
      row.addEventListener("click", function () { openSource(item, cites[0], row); });
    }
    var g = el("span", "glyph", isStep ? "→" : STATUS[st].glyph);
    g.setAttribute("aria-hidden", "true");
    row.appendChild(g);
    var body = el("span");
    body.appendChild(el("span", "claim-text", item.text));
    if (!isStep) {
      var meta = el("span", "row-meta");
      meta.appendChild(el("span", "status-word", STATUS[st].word));
      uniqueBySource(cites).forEach(function (ct) {
        var k = el("span", "key", "[" + num(ct.source) + "] " + siteOf(sources[ct.source]));
        k.setAttribute("role", "button");
        k.tabIndex = 0;
        k.setAttribute("aria-label", "Open source " + num(ct.source));
        function go(e) { e.stopPropagation(); openSource(item, ct, row); }
        k.addEventListener("click", go);
        k.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(e); } });
        meta.appendChild(k);
      });
      body.appendChild(meta);
    }
    row.appendChild(body);
    li.appendChild(row);
    return li;
  }
  function renderSection(title, list, isStep) {
    if (!list || !list.length) return;
    var s = el("section", "section");
    var head = el("div", "section-head");
    head.appendChild(el("h2", null, title));
    head.appendChild(el("span", null, String(list.length)));
    s.appendChild(head);
    var ul = el("ul", "rows");
    list.forEach(function (i) { ul.appendChild(renderRow(i, isStep)); });
    s.appendChild(ul);
    main.appendChild(s);
  }
  renderSection("Why", data.reasons);
  renderSection("Watch out", data.risks);
  renderSection("Didn't hold up", data.corrections);
  renderSection("Next step", data.next_steps, true);

  if (data.report) {
    var d = el("details", "report");
    d.appendChild(el("summary", null, "Original report"));
    d.appendChild(el("pre", null, data.report));
    main.appendChild(d);
  }

  // Reading pane
  function firstUse(id) {
    var all = [{ text: answer.text, cites: answer.cites }].concat(claims);
    for (var i = 0; i < all.length; i++) {
      var cs = all[i].cites || [];
      for (var j = 0; j < cs.length; j++) if (cs[j] && cs[j].source === id) return { item: all[i], cite: cs[j] };
    }
    return null;
  }
  function showList() {
    pane.classList.remove("is-open");
    pane.replaceChildren();
    var t = el("div", "pane-top");
    t.appendChild(el("p", "label", "Sources"));
    pane.appendChild(t);
    pane.appendChild(el("p", "pane-intro", "Click any line to read the exact passage it came from."));
    var ul = el("ol", "srclist");
    order.forEach(function (id) {
      var src = sources[id];
      var li = el("li");
      var b = el("button", "srcitem");
      b.type = "button";
      b.appendChild(el("span", "srcnum", String(num(id)).padStart(2, "0")));
      var txt = el("span");
      txt.appendChild(el("span", "srcname", src.title || "Untitled source"));
      txt.appendChild(el("span", "srcdom", siteOf(src)));
      b.appendChild(txt);
      b.addEventListener("click", function () {
        var use = firstUse(id);
        if (use) openSource(use.item, use.cite, null);
      });
      li.appendChild(b);
      ul.appendChild(li);
    });
    pane.appendChild(ul);
  }
  function close() {
    if (active) { active.setAttribute("aria-pressed", "false"); active = null; }
    showList();
  }
  function openSource(item, cite, row) {
    if (active) active.setAttribute("aria-pressed", "false");
    active = row;
    if (row) row.setAttribute("aria-pressed", "true");
    var src = sources[cite.source] || {};
    var st = STATUS[item.status] ? item.status : null;
    pane.replaceChildren();

    var t = el("div", "pane-top");
    t.appendChild(el("p", "label", "Source " + num(cite.source) + " of " + order.length));
    var x = el("button", "close", "Close");
    x.type = "button";
    x.addEventListener("click", close);
    t.appendChild(x);
    pane.appendChild(t);

    pane.appendChild(el("h3", "src-title", src.title || "Untitled source"));
    pane.appendChild(el("p", "src-site", siteOf(src)));

    if (st) {
      var v = el("div", "verdict st-" + st);
      var g = el("span", "glyph", STATUS[st].glyph);
      g.setAttribute("aria-hidden", "true");
      v.appendChild(g);
      var vt = el("div");
      vt.appendChild(el("strong", null, STATUS[st].word));
      vt.appendChild(document.createTextNode(item.note || STATUS[st].say));
      v.appendChild(vt);
      pane.appendChild(v);
    }
    var cl = el("p", "claim");
    cl.appendChild(el("b", null, "Claim "));
    cl.appendChild(document.createTextNode(item.text || ""));
    pane.appendChild(cl);

    var ctx = src.context || "";
    var quote = cite.quote || "";
    if (ctx || quote) {
      var p = el("blockquote", "passage");
      var body = ctx || quote;
      var at = quote ? body.indexOf(quote) : -1;
      if (at >= 0) {
        p.appendChild(document.createTextNode(body.slice(0, at)));
        p.appendChild(el("mark", null, quote));
        p.appendChild(document.createTextNode(body.slice(at + quote.length)));
      } else {
        p.textContent = body;
      }
      pane.appendChild(p);
    } else {
      pane.appendChild(el("p", "empty-quote", "No passage was captured from this source."));
    }

    var u = safeUrl(src.url);
    if (u) {
      var href = u.href.split("#")[0];
      if (quote) href += "#:~:text=" + encodeURIComponent(quote.slice(0, 300));
      var a = el("a", "open", "Open at this passage ↗");
      a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
      pane.appendChild(a);
      if (quote) pane.appendChild(el("p", "hint", "Jumps to the highlighted sentence in Chrome and Edge."));
    }
    pane.classList.add("is-open");
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
  showList();
})();
</script>
</body>
</html>
